name: Android Automated Build, Versioning & Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Documentation (README)
        run: |
          if [ ! -f "README.md" ]; then
            echo "::error::README.md is missing from root directory."
            exit 1
          fi
          echo "Validating mandatory sections in README.md..."
          grep -q "About Mirpur Blood Donation" README.md || { echo "::error::Missing 'About' section in README.md"; exit 1; }
          grep -q "Main Features" README.md || { echo "::error::Missing 'Main Features' section in README.md"; exit 1; }
          grep -q "Privacy & Security" README.md || { echo "::error::Missing 'Privacy & Security' section in README.md"; exit 1; }
          echo "Documentation validation successful."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: gradle

      - name: Calculate Version Code & Version Name
        id: versioning
        run: |
          COMMIT_COUNT=$(git rev-list --count HEAD)
          VERSION_CODE=$((COMMIT_COUNT + 100))
          VERSION_NAME="1.0.${COMMIT_COUNT}"
          echo "VERSION_CODE=${VERSION_CODE}" >> $GITHUB_ENV
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_ENV
          echo "Version Code: ${VERSION_CODE}, Version Name: ${VERSION_NAME}"

      - name: Make Gradle Executable
        run: chmod +x gradlew || true

      - name: Ensure Environment Configuration (.env.example)
        run: |
          if [ ! -f ".env.example" ]; then
            echo "Creating fallback .env.example file..."
            echo "# Placeholder environment configuration for build" > .env.example
            echo "# GEMINI_API_KEY=MY_GEMINI_API_KEY" >> .env.example
          fi
          if [ ! -f ".env" ]; then
            echo "Creating empty .env file..."
            touch .env
          fi

      - name: Decode Release Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "${{ runner.temp }}/release.keystore"
            echo "Release keystore decoded successfully."
          else
            echo "ANDROID_KEYSTORE_BASE64 secret is not set."
          fi

      - name: Build Android Release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -f "${{ runner.temp }}/release.keystore" ]; then
            echo "Building signed release APK with production keystore..."
            gradle assembleRelease --no-daemon
            mkdir -p build_outputs
            cp app/build/outputs/apk/release/app-release.apk build_outputs/app-release.apk
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret not set or empty. Falling back to assembleDebug for verification."
            gradle assembleDebug --no-daemon
            mkdir -p build_outputs
            cp app/build/outputs/apk/debug/app-debug.apk build_outputs/app-release.apk
          fi

      - name: Verify Release APK Signature
        run: |
          if [ -f "build_outputs/app-release.apk" ]; then
            echo "Verifying APK signature..."
            $ANDROID_HOME/build-tools/34.0.0/apksigner verify --verbose build_outputs/app-release.apk || true
          fi

      - name: Clean Up Keystore
        if: always()
        run: |
          rm -f "${{ runner.temp }}/release.keystore"

      - name: Generate Version Manifest
        run: |
          cat <<EOF > build_outputs/latest.json
          {
            "versionName": "${VERSION_NAME}",
            "versionCode": ${VERSION_CODE},
            "minSupportedVersionCode": ${VERSION_CODE},
            "releaseNotesBn": "মিরপুর ব্লাড ডোনেশন অ্যাপের নতুন সংস্করণ ${VERSION_NAME} আপডেট করা হয়েছে। গুরুত্বপূর্ণ ফিচার এবং উন্নত পারফরম্যান্স পেতে এখনই আপডেট করুন।",
            "releaseNotesEn": "Mirpur Blood Donation v${VERSION_NAME} is now available with critical improvements and new features.",
            "mandatory": true,
            "apkUrl": ""
          }
          EOF
          # Note: apkUrl will be resolved by the app from the GitHub Release Assets list.

      - name: Clean Old GitHub Releases (Keep Only Latest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OLD_RELEASES=$(gh release list --limit 50 --json tagName -q '.[].tagName')
          for TAG in $OLD_RELEASES; do
            echo "Deleting old release: $TAG"
            gh release delete "$TAG" --yes --cleanup-tag || true
          done

      - name: Create GitHub Release & Upload APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${VERSION_NAME}"
          gh release create "$TAG" \
            --title "Mirpur Blood Donation v${VERSION_NAME}" \
            --notes "Automated production release v${VERSION_NAME} (Build ${VERSION_CODE})" \
            build_outputs/app-release.apk \
            build_outputs/latest.json
